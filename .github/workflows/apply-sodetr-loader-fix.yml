name: Apply SO-DETR checkpoint loader fix

on:
  push:
    branches:
      - SO-DETR-V1.0
    paths:
      - .github/workflows/apply-sodetr-loader-fix.yml
  pull_request_target:
    branches:
      - SO-DETR-V1.0

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SO-DETR-V1.0
        uses: actions/checkout@v4
        with:
          ref: SO-DETR-V1.0
          fetch-depth: 0

      - name: Remove incomplete YOLOv10 compatibility code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ultralytics/nn/tasks.py")
          text = path.read_text(encoding="utf-8")

          old_criterion = '''    def init_criterion(self):
              """Initialize the loss criterion for the DetectionModel."""
              return E2EDetectLoss(self) if getattr(self, "end2end", False) else v8DetectionLoss(self)
          '''
          new_criterion = '''    def init_criterion(self):
              """Initialize the loss criterion for the DetectionModel."""
              return v8DetectionLoss(self)
          '''
          model_alias = '                "ultralytics.nn.tasks.YOLOv10DetectionModel": "ultralytics.nn.tasks.DetectionModel",  # YOLOv10\n'
          loss_alias = '                "ultralytics.utils.loss.v10DetectLoss": "ultralytics.utils.loss.E2EDetectLoss",  # YOLOv10\n'

          missing = []
          if old_criterion not in text:
              missing.append("DetectionModel.init_criterion")
          if model_alias not in text:
              missing.append("YOLOv10DetectionModel alias")
          if loss_alias not in text:
              missing.append("v10DetectLoss alias")
          if missing:
              raise SystemExit("Expected code not found: " + ", ".join(missing))

          text = text.replace(old_criterion, new_criterion, 1)
          text = text.replace(model_alias, "", 1)
          text = text.replace(loss_alias, "", 1)
          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile ultralytics/nn/tasks.py
          ! grep -Rns -E 'E2EDetectLoss|v10DetectLoss|YOLOv10DetectionModel' ultralytics/nn/tasks.py

      - name: Commit loader fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-sodetr-loader-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ultralytics/nn/tasks.py .github/workflows/apply-sodetr-loader-fix.yml
          git commit -m "fix: restore RT-DETR checkpoint loading"
          git push origin HEAD:SO-DETR-V1.0
